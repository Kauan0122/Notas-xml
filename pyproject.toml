[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notaxml"
version = "0.1.0"
description = "Download automático de NF-e emitidas contra a empresa diretamente da SEFAZ (NFeDistribuicaoDFe)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=4.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
notaxml = "notaxml.cli:main"

[tool.setuptools]
packages = ["notaxml"]
