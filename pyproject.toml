[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notaxml"
version = "1.4.0"
description = "Download automático de NF-e emitidas contra a empresa diretamente da SEFAZ (NFeDistribuicaoDFe)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=4.9",
    "cryptography>=42",
    "flask>=3.0",
    "waitress>=3.0",
    "truststore>=0.9",
    "brazilfiscalreport>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
notaxml = "notaxml.cli:main"

[tool.setuptools]
packages = ["notaxml", "notaxml.web"]

[tool.setuptools.package-data]
"notaxml.web" = ["templates/*.html", "static/*"]
