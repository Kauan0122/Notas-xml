{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="caixa estreita centralizada">
  <h1>Entrar</h1>
  <form method="post" class="form-empilhado">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Senha de acesso <input type="password" name="senha" autofocus required></label>
    <button class="botao primario">Entrar</button>
  </form>
</section>
{% endblock %}
