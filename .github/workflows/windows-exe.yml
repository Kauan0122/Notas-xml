name: Gerar NotaXML.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar uma Release com esta versão (ex.: v1.0.0). Deixe vazio para só gerar o .exe."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install ".[dev]"
      - name: Testes
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar o docker-compose
        run: NOTAXML_WEB_SENHA=teste docker compose config -q
      - name: Construir a imagem
        run: docker build -t notaxml:teste .
      - name: Testar o contêiner (saúde, login e primeiro uso)
        run: |
          docker run -d --name nx -p 8000:8000 -e NOTAXML_WEB_SENHA=senha-de-teste -v nxdados:/dados notaxml:teste
          for i in $(seq 1 30); do
            [ "$(curl -s http://127.0.0.1:8000/saude)" = "notaxml" ] && break
            sleep 1
          done
          test "$(curl -s http://127.0.0.1:8000/saude)" = "notaxml"
          # sem login, redireciona para a tela de entrada
          saida=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8000/)
          echo "$saida"
          case "$saida" in "302 "*"/login"*) ;; *) echo "esperava redirecionar para /login"; exit 1;; esac
          # entra com a senha e vê a tela de primeiro uso
          curl -s -c jar -o login.html http://127.0.0.1:8000/login
          csrf=$(sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' login.html | head -1)
          test -n "$csrf"
          curl -s -b jar -c jar -o /dev/null -d "csrf=$csrf" -d "senha=senha-de-teste" "http://127.0.0.1:8000/login"
          curl -s -b jar http://127.0.0.1:8000/configuracao | grep -q "Bem-vindo ao NotaXML"
          # roda sem ser root e grava no volume
          test "$(docker exec nx id -u)" = "1000"
          docker exec nx test -s /dados/chave_sessao
          # o contêiner declara-se saudável
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nx)" = "healthy" ] && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' nx)" = "healthy"
      - name: Registros do contêiner (em caso de falha)
        if: failure()
        run: docker logs nx

  exe:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install . pyinstaller pillow
      - name: Gerar ícone
        run: python empacotamento/gerar_icone.py
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name NotaXML
          --icon empacotamento/notaxml.ico --collect-data notaxml
          --collect-data brazilfiscalreport --collect-data fpdf --collect-data barcode
          empacotamento/NotaXML.py

      - name: Testar o executável (abre, mostra as notas e gera o DANFE)
        shell: pwsh
        env:
          NOTAXML_SEM_NAVEGADOR: "1"
          NFE_CERT_SENHA: "1234"
        run: |
          # pasta portátil com configuração, certificado falso e uma NF-e de exemplo
          $chave = (python empacotamento/preparar_teste.py portatil).Trim()
          Copy-Item dist\NotaXML.exe portatil\
          $p = Start-Process -FilePath (Resolve-Path portatil\NotaXML.exe) -WorkingDirectory portatil -PassThru `
                 -RedirectStandardOutput saida.txt -RedirectStandardError erros.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/saude).Content -eq "notaxml" } catch {}
          }
          Get-Content saida.txt, erros.txt -ErrorAction SilentlyContinue
          try {
            if (-not $ok) { throw "O executável não respondeu" }
            $pagina = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/).Content
            if ($pagina -notmatch "Notas recebidas") { throw "A lista de notas não carregou" }
            $pdf = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/nota/$chave/danfe.pdf"
            $inicio = [System.Text.Encoding]::ASCII.GetString($pdf.Content[0..3])
            if ($pdf.Headers['Content-Type'] -notmatch "application/pdf" -or $inicio -ne "%PDF") { throw "DANFE inválido" }
            Write-Host "Executável OK (DANFE de $($pdf.Content.Length) bytes)"
          } finally {
            # o .exe empacotado tem 2 processos (lançador + sistema): encerra a árvore inteira
            taskkill /PID $p.Id /T /F | Out-Null
            Start-Sleep -Seconds 2
          }

      - name: Testar o modo servidor do executável (aberto para a rede, com senha)
        shell: pwsh
        env:
          NOTAXML_SEM_NAVEGADOR: "1"
          NFE_CERT_SENHA: "1234"
          NOTAXML_WEB_SENHA: "senha-de-teste-123"
        run: |
          python empacotamento/preparar_teste.py servidor | Out-Null
          Copy-Item dist\NotaXML.exe servidor\
          $p = Start-Process -FilePath (Resolve-Path servidor\NotaXML.exe) -ArgumentList "--servidor" -WorkingDirectory servidor `
                 -PassThru -RedirectStandardOutput saida2.txt -RedirectStandardError erros2.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/saude).Content -eq "notaxml" } catch {}
          }
          Get-Content saida2.txt, erros2.txt -ErrorAction SilentlyContinue
          try {
            if (-not $ok) { throw "O executável não respondeu em modo servidor" }
            # escutando em todas as interfaces (e não só no próprio computador)
            $escuta = (Get-NetTCPConnection -LocalPort 8000 -State Listen).LocalAddress
            if ($escuta -notcontains "0.0.0.0") { throw "Não está aberto para a rede (escutando em: $escuta)" }
            # exige login
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ -MaximumRedirection 0 -SkipHttpErrorCheck
            if ($r.StatusCode -ne 302 -or $r.Headers.Location -notmatch "/login") { throw "Não pediu login" }
            Write-Host "Modo servidor OK"
          } finally {
            # o .exe empacotado tem 2 processos (lançador + sistema): encerra a árvore inteira
            taskkill /PID $p.Id /T /F | Out-Null
            Start-Sleep -Seconds 2
          }

      - uses: actions/upload-artifact@v4
        with:
          name: NotaXML-windows
          path: dist/NotaXML.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.versao != '')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NotaXML-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NotaXML ${{ inputs.versao || github.ref_name }}
          files: NotaXML.exe
          body: |
            Baixe o **NotaXML.exe**, dê dois cliques e siga a tela de boas-vindas (certificado A1, senha e UF).
            Aviso do Windows na primeira vez: **Mais informações → Executar assim mesmo**.
            Veja o README para detalhes.
          generate_release_notes: true
