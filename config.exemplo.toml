# Copie este arquivo para config.toml e preencha com os dados da sua empresa.

[empresa]
cnpj = "12.345.678/0001-99"
uf = "SP"                         # UF da empresa (usada como cUFAutor)

[certificado]
arquivo = "certificado.pfx"       # certificado digital A1 (e-CNPJ) da empresa
# Recomendado: informe a senha pela variável de ambiente NFE_CERT_SENHA.
# Se nada for informado, a senha é pedida ao rodar o comando.
# senha = ""

[sefaz]
ambiente = "producao"             # "producao" ou "homologacao"
timeout = 60
# Se der erro de verificação SSL do servidor da SEFAZ, aponte para a cadeia ICP-Brasil (veja o README):
# ca_bundle = "icp-brasil.pem"

[armazenamento]
pasta = "dados"                   # XMLs e o banco notas.db ficam aqui

[sincronizacao]
# Envia "Ciência da Operação" automaticamente para cada nota nova, o que libera o download do XML completo.
ciencia_automatica = false

[web]
# Interface no navegador: rode "notaxml web" e acesse http://127.0.0.1:8000
host = "127.0.0.1"                # use "0.0.0.0" para acessar de outros computadores da rede
porta = 8000
# Senha de acesso à interface. Obrigatória se o host não for 127.0.0.1.
# Recomendado: variável de ambiente NOTAXML_WEB_SENHA.
# senha = ""
sincronizacao_automatica = true   # a interface sincroniza sozinha enquanto estiver aberta
intervalo_minutos = 60            # mínimo 60 (regra da SEFAZ)
